name: CD

on:
  push:
    branches:
      - main

jobs:
  cd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore GameStore.Backend/GameStore.Backend.csproj

      - name: Publish application
        run: |
          dotnet publish GameStore.Backend/GameStore.Backend.csproj \
            -c Release \
            -o publish

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamestore-backend
          path: publish
